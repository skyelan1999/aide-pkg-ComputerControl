name: Windows native bridge
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled development tools
        shell: cmd
        run: |
          go version
          node --version
          python --version
      - name: Build native hosts without PowerShell
        shell: cmd
        run: windows\build.cmd
      - name: Protocol and plugin tests
        shell: cmd
        run: |
          set GOARCH=amd64
          go test -count=1 ./...
          if errorlevel 1 exit /b 1
          node --test tests/plugin.cjs
          if errorlevel 1 exit /b 1
      - name: Real WinForms desktop fixture
        shell: cmd
        run: |
          set "FRAMEWORK=%WINDIR%\Microsoft.NET\Framework\v4.0.30319"
          "%FRAMEWORK%\csc.exe" /nologo /target:winexe /out:dist\DesktopFixture.exe /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll windows\DesktopFixture.cs
          if errorlevel 1 exit /b 1
          python scripts/windows_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-hosts-${{ matrix.os }}
          path: |
            dist/AideComputerBridge-windows-*.exe
            dist/AideComputerDesktop.exe
          retention-days: 5
